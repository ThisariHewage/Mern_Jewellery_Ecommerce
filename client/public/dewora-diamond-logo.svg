      <stop offset="0" stop-color="#F8E7A4"/>
      <stop offset="0.35" stop-color="#D4AF37"/>
      <stop offset="0.65" stop-color="#A97A20"/>
      <stop offset="1" stop-color="#F3D77A"/>
